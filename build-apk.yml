name: APKを作る

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "NoujiruPomodoro_Project.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: プロジェクトを展開
        run: unzip -q -o NoujiruPomodoro_Project.zip -d build-source

      - name: Java 17を準備
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradleを準備
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APKをビルド
        run: |
          cd build-source/NoujiruPomodoro
          gradle --no-daemon assembleDebug

      - name: APK名を変更
        run: |
          cp build-source/NoujiruPomodoro/app/build/outputs/apk/debug/app-debug.apk \
             NoujiruPomodoro-v5.3.2.apk

      - name: APKを保存
        uses: actions/upload-artifact@v4
        with:
          name: NoujiruPomodoro-v5.3.2
          path: NoujiruPomodoro-v5.3.2.apk
          retention-days: 30
